parknova:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:https://keycloak-test.eden-tech.io}
    realm: ${KEYCLOAK_REALM:parknova}
    client-id: ${KEYCLOAK_CLIENT_ID:parknova-api-gateway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:CHANGE_ME}
    jwt-decoder-enabled: true

logging:
  level:
    com.parknova.parknovaapigateway: DEBUG
