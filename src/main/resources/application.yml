spring:
  application:
    name: ${APPLICATION_NAME:parknova-api-gateway}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}
  cloud:
    gateway:
      mvc:
        routes:
          - id: parknova-offstreet-mobile
            uri: ${MOBILE_SERVICE_URI:http://localhost:8081}
            predicates:
              - Path=/client/**,/internal/**,/mobile/**
          - id: parknova-offstreet-service
            uri: ${OFFSTREET_SERVICE_URI:http://localhost:8090}
            predicates:
              - Path=/api/v1/**,/customer/**,/external/**
          - id: parknova-org-admin
            uri: ${ORG_ADMIN_URI:http://localhost:8091}
            predicates:
              - Path=/org/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
  lifecycle:
    timeout-per-shutdown-phase: 20s

parknova:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:https://keycloak-dev.eden-tech.io}
    realm: ${KEYCLOAK_REALM:parknova}
    # Admin/service client used by KeycloakAdminService (create user, verify email, reset password).
    client-id: ${KEYCLOAK_CLIENT_ID:parknova-api-gateway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:CHANGE_ME}
    jwt-decoder-enabled: true
    # Per-channel confidential login (ROPC) clients used by the BFF /auth/{channel}/login.
    clients:
      portal:
        client-id: ${KEYCLOAK_PORTAL_CLIENT_ID:parknova-portal}
        client-secret: ${KEYCLOAK_PORTAL_CLIENT_SECRET:CHANGE_ME}
      org:
        client-id: ${KEYCLOAK_ORG_CLIENT_ID:parknova-org}
        client-secret: ${KEYCLOAK_ORG_CLIENT_SECRET:CHANGE_ME}
      mobile:
        client-id: ${KEYCLOAK_MOBILE_CLIENT_ID:parknova-mobile}
        client-secret: ${KEYCLOAK_MOBILE_CLIENT_SECRET:CHANGE_ME}
  otp:
    length: 6
    ttl-minutes: 10
    max-attempts: 5
  mail:
    from: ${MAIL_FROM:noreply@parknova.io}

server:
  port: ${APPLICATION_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.parknova.parknovaapigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
