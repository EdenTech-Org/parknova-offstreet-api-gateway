spring:
  application:
    name: ${APPLICATION_NAME:parknova-api-gateway}
  cloud:
    gateway:
      mvc:
        routes:
          - id: parknova-offstreet-mobile
            uri: ${MOBILE_SERVICE_URI:http://localhost:8081}
            predicates:
              - Path=/client/**,/internal/v1/**,/mobile/**,/enforcer/**
          - id: parknova-offstreet-service
            uri: ${OFFSTREET_SERVICE_URI:http://localhost:8090}
            predicates:
              - Path=/api/v1/**,/api/external/**,/customer/**
          - id: parknova-org-admin
            uri: ${ORG_ADMIN_SERVICE_URI:http://localhost:8091}
            predicates:
              - Path=/org-admin/**
            filters:
              - StripPrefix=1
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

parknova:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic:
      email: ${KAFKA_TOPIC_EMAIL:parknova.email.send}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:https://keycloak-dev.eden-tech.io}
    realm: ${KEYCLOAK_REALM:parknova}
    client-id: ${KEYCLOAK_CLIENT_ID:parknova-api-gateway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:jVIRWGI96TvTgKyQV7rmqZBgGq2kJazQ}
    jwt-decoder-enabled: true
  enforcer-keycloak:
    base-url: ${ENFORCER_KEYCLOAK_BASE_URL:${KEYCLOAK_BASE_URL:https://keycloak-dev.eden-tech.io}}
    realm: ${ENFORCER_KEYCLOAK_REALM:eden-crm-sec-users}
  portal:
    base-url: ${PORTAL_BASE_URL:http://localhost:3000}
    invite-ttl-hours: ${PORTAL_INVITE_TTL_HOURS:72}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@parknova.local}
  service-to-service-secret: ${SERVICE_TO_SERVICE_SECRET:dev-secret}
  org-admin-base-url: ${ORG_ADMIN_SERVICE_URI:http://localhost:8091}

server:
  port: ${APPLICATION_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.parknova.parknovaapigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
